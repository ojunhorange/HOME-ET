# Firebase App Hosting 설정. 키는 Cloud Secret Manager에 저장:
#   firebase apphosting:secrets:set gemini-api-key
#   firebase apphosting:secrets:set maps-server-key
#   firebase apphosting:secrets:set maps-browser-key
runConfig:
  maxInstances: 2

env:
  - variable: GEMINI_API_KEY
    secret: gemini-api-key
    availability: [RUNTIME]
  - variable: GOOGLE_MAPS_SERVER_KEY # Routes API
    secret: maps-server-key
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY # Maps JS + Places, 브라우저 노출용(HTTP 리퍼러 제한 필수)
    secret: maps-browser-key
    availability: [BUILD, RUNTIME]
